name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
      - name: Check whether this version is already on npm
        id: already
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "confirm-check@$v" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "confirm-check@$v is already on npm, nothing to publish"
          fi
      - if: steps.already.outputs.published != 'true'
        run: npm publish --provenance --access public
